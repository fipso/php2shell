[PHP]
engine = On
expose_php = Off
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
error_log = /home/fipso/code/php2shell/lab/php-error.log
report_memleaks = Off
memory_limit = 16M
post_max_size = 64M
upload_max_filesize = 64M
file_uploads = On
max_file_uploads = 20
max_execution_time = 30
max_input_time = 60
max_input_vars = 1000
max_input_nesting_level = 64
variables_order = EGPCS
request_order = GP
enable_post_data_reading = On
fatal_error_backtraces = On
zend.assertions = -1

[Session]
session.save_handler = files
session.save_path = /home/fipso/code/php2shell/lab/sessions
session.serialize_handler = php
session.use_cookies = On
session.use_only_cookies = On
session.use_strict_mode = Off
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.min_freq = 0
session.upload_progress.prefix = PHP_SESSION_UPLOAD_PROGRESS

[Opcache]
opcache.enable = 0
opcache.enable_cli = 0
