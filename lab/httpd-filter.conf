ServerRoot /home/fipso/code/php2shell/lab
PidFile /home/fipso/code/php2shell/lab/httpd-filter.pid
Listen 127.0.0.1:18089
ServerName localhost

LoadModule mpm_prefork_module /nix/store/yail3prbsk5v6rc212830bf3zl1j6zgj-apache-httpd-2.4.69/modules/mod_mpm_prefork.so
LoadModule authz_core_module /nix/store/yail3prbsk5v6rc212830bf3zl1j6zgj-apache-httpd-2.4.69/modules/mod_authz_core.so
LoadModule authz_host_module /nix/store/yail3prbsk5v6rc212830bf3zl1j6zgj-apache-httpd-2.4.69/modules/mod_authz_host.so
LoadModule dir_module /nix/store/yail3prbsk5v6rc212830bf3zl1j6zgj-apache-httpd-2.4.69/modules/mod_dir.so
LoadModule mime_module /nix/store/yail3prbsk5v6rc212830bf3zl1j6zgj-apache-httpd-2.4.69/modules/mod_mime.so
LoadModule log_config_module /nix/store/yail3prbsk5v6rc212830bf3zl1j6zgj-apache-httpd-2.4.69/modules/mod_log_config.so
LoadModule unixd_module /nix/store/yail3prbsk5v6rc212830bf3zl1j6zgj-apache-httpd-2.4.69/modules/mod_unixd.so
LoadModule php_module /home/fipso/code/php2shell/lab/libphp-nts.so

PHPIniDir /home/fipso/code/php2shell/lab
# The 4 MiB multipart key must fail its hash allocation after the earlier
# 4 MiB name copy succeeds.  Recalibrate if name-len/post_max_size changes.
php_value memory_limit 28M
User fipso
Group users

StartServers 1
MinSpareServers 1
MaxSpareServers 1
MaxRequestWorkers 1
MaxConnectionsPerChild 0

DocumentRoot /home/fipso/code/php2shell/lab/www
DirectoryIndex index.php
EnableSendfile Off

ErrorLog /home/fipso/code/php2shell/lab/httpd-filter-error.log
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /home/fipso/code/php2shell/lab/httpd-filter-access.log common

<Directory />
    AllowOverride None
    Require all granted
</Directory>

<Directory /home/fipso/code/php2shell/lab/www>
    AllowOverride None
    Require all granted
</Directory>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
